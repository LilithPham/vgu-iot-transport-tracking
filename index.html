<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Hệ thống Giám sát VGU - Bản đồ Miễn phí</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
        .info-box {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div class="info-box">
        <h3 style="margin:0; color: #003366;">VGU Transport Tracking</h3>
        <p id="coords" style="margin: 5px 0;">Đang kết nối Cloud...</p>
        <p id="status" style="font-size: 12px; color: gray;">Trạng thái: Đang lấy dữ liệu từ Firebase...</p>
    </div>

    <div id="map"></div>

    <script>
        // 2. Khởi tạo bản đồ tại khu vực VGU Bến Cát
        var map = L.map('map').setView([11.142, 106.600], 15);

        // 3. Thêm lớp bản đồ từ OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 4. Tạo ICON XE BUS và đường vẽ lộ trình
        var busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        var marker = L.marker([11.142, 106.600], {icon: busIcon}).addTo(map);
        var path = L.polyline([], {color: 'blue', weight: 4, opacity: 0.7}).addTo(map);

        // 5. Hàm cập nhật vị trí lên bản đồ
        function updateLocation(lat, lon) {
            var newLatLng = new L.LatLng(lat, lon);
            marker.setLatLng(newLatLng);
            path.addLatLng(newLatLng);
            map.panTo(newLatLng); 
            document.getElementById('coords').innerHTML = "Vĩ độ: " + lat + " | Kinh độ: " + lon;
            document.getElementById('status').innerText = "Cập nhật lúc: " + new Date().toLocaleTimeString();
        }

        // 6. TỰ ĐỘNG CẬP NHẬT: Cứ mỗi 5 giây lấy dữ liệu từ Link Firebase 
        const FIREBASE_URL = 'https://vgu-transport-iot-default-rtdb.asia-southeast1.firebasedatabase.app/tracking.json';

        function fetchData() {
            fetch(FIREBASE_URL) 
                .then(response => response.json())
                .then(data => {
                    // Chỗ này Thu kiểm tra nếu để dữ liệu trực tiếp trong tracking
                    // thì dùng data.lat, data.lon nhé.
                    if (data && data.lat && data.lon) {
                        updateLocation(data.lat, data.lon);
                    }
                })
                .catch(err => {
                    console.error("Lỗi kết nối Firebase:", err);
                    document.getElementById('status').innerText = "Trạng thái: Lỗi kết nối Firebase!";
                });
        }

        // Chạy lần đầu tiên và sau đó lặp lại mỗi 5 giây
        fetchData();
        setInterval(fetchData, 2000); 

    </script>
</body>
</html>
